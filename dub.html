---
layout: default
---

<div id="dubbing-app" style="text-align: center; padding: 20px;">
  <h1>Aplicativo de Dublagem do YouTube</h1>
  <p>Cole a URL de um vídeo do YouTube em inglês abaixo para dublá-lo para o português.</p>

  <input type="text" id="youtube-url" placeholder="Cole a URL do YouTube aqui" style="width: 80%; max-width: 500px; padding: 10px; margin-bottom: 10px;">
  <button id="dub-button" style="padding: 10px 20px; cursor: pointer;">Dublar Vídeo</button>

  <div id="video-container" style="margin-top: 20px;">
    <!-- O player de vídeo do YouTube será incorporado aqui -->
  </div>

  <div id="status" style="margin-top: 20px; font-style: italic;"></div>
</div>

<script>
  const youtubeUrlInput = document.getElementById('youtube-url');
  const dubButton = document.getElementById('dub-button');
  const videoContainer = document.getElementById('video-container');
  const statusDiv = document.getElementById('status');
  let player;

  dubButton.addEventListener('click', () => {
    const url = youtubeUrlInput.value;
    if (!url) {
      alert('Por favor, insira uma URL do YouTube.');
      return;
    }

    const videoId = extractVideoId(url);
    if (!videoId) {
      alert('URL do YouTube inválida.');
      return;
    }

    statusDiv.textContent = 'Carregando vídeo...';
    embedYouTubePlayer(videoId);
  });

  function extractVideoId(url) {
    const regex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
    const matches = url.match(regex);
    return matches ? matches[1] : null;
  }

  function embedYouTubePlayer(videoId) {
    videoContainer.innerHTML = `<iframe id="youtube-player" width="560" height="315" src="https://www.youtube.com/embed/${videoId}?enablejsapi=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;

    // Aguarde a API do player do YouTube estar pronta
    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('youtube-player', {
        events: {
          'onReady': onPlayerReady,
        }
      });
    };

    if (!window.YT) {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    } else {
       player = new YT.Player('youtube-player', {
        events: {
          'onReady': onPlayerReady,
        }
      });
    }
  }

  async function onPlayerReady(event) {
    statusDiv.textContent = 'Vídeo carregado. Iniciando processo de dublagem...';
    player.mute();
    await startDubbingProcess();
  }

  async function startDubbingProcess() {
    try {
      // ETAPA 1: Obter áudio do vídeo (requer um serviço de back-end)
      // Esta é uma função de espaço reservado. Você precisará de um serviço de back-end
      // para baixar o áudio de um vídeo do YouTube. Existem muitas bibliotecas como
      // 'ytdl-core' para Node.js. Você NÃO PODE fazer isso diretamente do lado do cliente
      // devido às restrições do CORS.
      statusDiv.textContent = 'Etapa 1/4: Baixando áudio... (Espaço reservado)';
      const audioBlob = await getAudioFromYouTube();
      console.log('Áudio obtido (simulado).', audioBlob);

      // ETAPA 2: Transcrever áudio para texto (requer uma API de fala para texto)
      // Use um serviço como a API Speech-to-Text do Google, OpenAI Whisper ou AssemblyAI.
      // Você precisará se inscrever para uma chave de API e fazer uma solicitação de API a partir de seu back-end.
      statusDiv.textContent = 'Etapa 2/4: Transcrevendo áudio... (Espaço reservado)';
      const englishText = await transcribeAudio(audioBlob);
      console.log('Texto em inglês:', englishText);

      // ETAPA 3: Traduzir texto para o português (requer uma API de tradução)
      // Use um serviço como a API Google Translate, DeepL ou Microsoft Translator.
      // Novamente, isso deve ser feito em seu back-end para proteger sua chave de API.
      statusDiv.textContent = 'Etapa 3/4: Traduzindo texto... (Espaço reservado)';
      const portugueseText = await translateText(englishText);
      console.log('Texto em português:', portugueseText);

      // ETAPA 4: Sintetizar a fala do texto em português (usando a API Web Speech)
      // Esta parte pode ser feita no lado do cliente.
      statusDiv.textContent = 'Etapa 4/4: Gerando áudio dublado...';
      await speakText(portugueseText);

      statusDiv.textContent = 'Dublagem concluída!';
      player.unMute(); // Opcional: reative o som do vídeo original em um volume baixo
      player.playVideo();

    } catch (error) {
      console.error('Erro no processo de dublagem:', error);
      statusDiv.textContent = `Erro: ${error.message}`;
    }
  }

  // --- FUNÇÕES DE ESPAÇO RESERVADO ---
  // Você precisará substituir estas funções por chamadas de API reais para o seu back-end.

  async function getAudioFromYouTube() {
    // **AÇÃO NECESSÁRIA:** Implemente um endpoint de back-end que receba um ID de vídeo do YouTube,
    // baixe o áudio e o retorne como um blob de áudio.
    console.warn('Aviso: getAudioFromYouTube() é uma simulação.');
    // Simula um atraso de rede
    await new Promise(resolve => setTimeout(resolve, 1500));
    // Retorna um blob de áudio falso.
    return new Blob([], { type: 'audio/webm' });
  }

  async function transcribeAudio(audioBlob) {
    // **AÇÃO NECESSÁRIA:** Envie o blob de áudio para o seu back-end, que então o encaminha
    // para um serviço de transcrição de sua escolha (por exemplo, OpenAI Whisper).
    console.warn('Aviso: transcribeAudio() é uma simulação.');
    await new Promise(resolve => setTimeout(resolve, 1500));
    // Retorna um texto de exemplo.
    return "Hello, this is a demonstration of a YouTube video dubbing application.";
  }

  async function translateText(text) {
    // **AÇÃO NECESSÁRIA:** Envie o texto em inglês para o seu back-end, que então chama
    // uma API de tradução (por exemplo, Google Translate) para traduzi-lo para o português.
    console.warn('Aviso: translateText() é uma simulação.');
    await new Promise(resolve => setTimeout(resolve, 1500));
    // Retorna uma tradução de exemplo.
    return "Olá, esta é uma demonstração de um aplicativo de dublagem de vídeo do YouTube.";
  }

  // --- FUNÇÃO DE SÍNTESE DE FALA REAL ---

  function speakText(text) {
    return new Promise((resolve, reject) => {
      if (!('speechSynthesis' in window)) {
        reject(new Error('A síntese de fala não é suportada neste navegador.'));
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'pt-BR'; // Define o idioma para português do Brasil
      utterance.rate = 1.0; // Velocidade da fala

      // Encontra uma voz em português
      const voices = window.speechSynthesis.getVoices();
      const ptVoice = voices.find(voice => voice.lang === 'pt-BR');
      if (ptVoice) {
        utterance.voice = ptVoice;
      }

      utterance.onend = () => {
        resolve();
      };

      utterance.onerror = (event) => {
        reject(new Error(`Erro na síntese de fala: ${event.error}`));
      };

      // Inicia a fala
      window.speechSynthesis.speak(utterance);
    });
  }
</script>
